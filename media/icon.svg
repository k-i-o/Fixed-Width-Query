<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="24" fill="#1F2430"/>
  <!-- Fixed-width columns: the vertical cut lines are the whole idea of the format. -->
  <g fill="#4FC1E9">
    <rect x="22" y="30" width="26" height="8" rx="2"/>
    <rect x="22" y="46" width="26" height="8" rx="2"/>
    <rect x="22" y="62" width="26" height="8" rx="2"/>
    <rect x="22" y="78" width="26" height="8" rx="2"/>
    <rect x="22" y="94" width="26" height="8" rx="2"/>
  </g>
  <g fill="#8E9BB3">
    <rect x="56" y="30" width="18" height="8" rx="2"/>
    <rect x="56" y="46" width="18" height="8" rx="2"/>
    <rect x="56" y="62" width="18" height="8" rx="2"/>
    <rect x="56" y="78" width="18" height="8" rx="2"/>
    <rect x="56" y="94" width="18" height="8" rx="2"/>
  </g>
  <g fill="#586172">
    <rect x="82" y="30" width="24" height="8" rx="2"/>
    <rect x="82" y="46" width="24" height="8" rx="2"/>
    <rect x="82" y="62" width="24" height="8" rx="2"/>
    <rect x="82" y="78" width="24" height="8" rx="2"/>
    <rect x="82" y="94" width="24" height="8" rx="2"/>
  </g>
  <!-- Column cut guides -->
  <g stroke="#F6B93B" stroke-width="2" opacity="0.85">
    <line x1="52" y1="22" x2="52" y2="110"/>
    <line x1="78" y1="22" x2="78" y2="110"/>
  </g>
</svg>
